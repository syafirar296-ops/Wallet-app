<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Wallet</title>
<style>
  :root{
    --bg: #050509;
    --panel: #0d0d14;
    --panel-border: rgba(255,255,255,0.06);
    --purple: #8b5cf6;
    --purple-dim: rgba(139,92,246,0.15);
    --green: #22c55e;
    --text-primary: #f5f5f7;
    --text-secondary: #8a8a94;
    --text-tertiary: #55555f;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: var(--bg);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    max-width: 480px;
    margin: 0 auto;
    padding-bottom: 24px;
  }

  /* Header */
  .header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    padding: 24px 20px 8px;
  }
  .header h1{
    font-size: 24px;
    font-weight: 700;
  }
  .header .sub{
    color: var(--text-secondary);
    font-size: 14px;
    margin-top: 2px;
  }
  .bell{
    width: 40px;
    height: 40px;
    display:flex;
    align-items:center;
    justify-content:center;
    color: var(--text-primary);
  }

  /* Balance card */
  .balance-card{
    margin: 12px 16px 0;
    padding: 20px;
    border-radius: 20px;
    background: linear-gradient(160deg, rgba(139,92,246,0.18) 0%, rgba(20,10,35,0.6) 55%, #0a0a10 100%);
    border: 1px solid rgba(139,92,246,0.25);
    position: relative;
  }
  .balance-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
  }
  .balance-label{
    display:flex;
    align-items:center;
    gap:6px;
    color: var(--text-secondary);
    font-size: 14px;
  }
  .currency-pill-wrap{ position: relative; }
  .currency-pill{
    background: #111118;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    padding: 8px 30px 8px 14px;
    font-size: 14px;
    font-weight: 600;
    color: var(--text-primary);
    appearance: none;
    -webkit-appearance: none;
    outline: none;
    cursor: pointer;
  }
  .currency-pill-wrap::after{
    content: '';
    position: absolute;
    right: 12px;
    top: 50%;
    width: 8px;
    height: 8px;
    border-right: 2px solid var(--text-secondary);
    border-bottom: 2px solid var(--text-secondary);
    transform: translateY(-70%) rotate(45deg);
    pointer-events: none;
  }

  .range-pills{
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 0 4px 14px;
    scrollbar-width: none;
  }
  .range-pills::-webkit-scrollbar{ display:none; }
  .range-pill{
    flex-shrink: 0;
    background: #111118;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 7px 14px;
    font-size: 13px;
    color: var(--text-secondary);
    cursor: pointer;
    white-space: nowrap;
  }
  .range-pill.active{
    background: var(--purple);
    border-color: var(--purple);
    color: #fff;
    font-weight: 600;
  }
  .balance-amount{
    font-size: 42px;
    font-weight: 800;
    letter-spacing: -1px;
    margin-top: 10px;
  }
  .balance-btc{
    color: var(--text-secondary);
    font-size: 14px;
    margin-top: 6px;
  }
  .change-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top: 16px;
  }
  .change-badge{
    background: var(--purple);
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    padding: 6px 12px;
    border-radius: 20px;
    display:flex;
    align-items:center;
    gap:4px;
  }
  .change-today{
    color: var(--text-secondary);
    font-size: 14px;
  }

  /* Portfolio card */
  .portfolio-card{
    margin: 16px 16px 0;
    padding: 20px 16px;
    border-radius: 20px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
  }
  .portfolio-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding: 0 4px 16px;
  }
  .portfolio-header h2{
    font-size: 19px;
    font-weight: 700;
  }
  .view-details{
    color: var(--purple);
    font-size: 14px;
    font-weight: 600;
    display:flex;
    align-items:center;
    gap:2px;
    text-decoration:none;
  }
  .col-headers{
    display:grid;
    grid-template-columns: 1.8fr 1fr 0.8fr;
    padding: 0 4px 10px;
    color: var(--text-tertiary);
    font-size: 12.5px;
  }
  .col-headers span:not(:first-child){ text-align:right; }

  .market-col-headers{
    display:grid;
    grid-template-columns: 22px 1.8fr 1fr 0.8fr;
    padding: 0 4px 10px;
    color: var(--text-tertiary);
    font-size: 12.5px;
  }
  .market-col-headers span:not(:first-child){ text-align:right; }

  .search-box{
    margin: 0 4px 14px;
    position: relative;
  }
  .search-box input{
    width: 100%;
    background: #111118;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 10px 14px 10px 36px;
    color: var(--text-primary);
    font-size: 14px;
    outline: none;
  }
  .search-box input::placeholder{ color: var(--text-tertiary); }
  .search-box svg{
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-tertiary);
  }
  .list-status{
    text-align:center;
    color: var(--text-secondary);
    font-size: 13px;
    padding: 20px 0;
  }

  .asset-row{
    display:grid;
    grid-template-columns: 22px 1.8fr 1fr 0.8fr;
    align-items:center;
    padding: 12px 4px;
    border-top: 1px solid rgba(255,255,255,0.05);
  }
  .asset-row:first-of-type{ border-top:none; }

  .portfolio-row{
    display:grid;
    grid-template-columns: 1.8fr 1fr 0.8fr;
    align-items:center;
    padding: 12px 4px;
    border-top: 1px solid rgba(255,255,255,0.05);
  }
  .portfolio-row:first-of-type{ border-top:none; }
  .asset-info{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .asset-icon{
    width: 36px;
    height: 36px;
    border-radius: 50%;
    flex-shrink:0;
    display:block;
    overflow: hidden;
    background: #1a1a24;
  }
  .asset-icon svg, .asset-icon img{
    width: 100%;
    height: 100%;
    border-radius: 50%;
    display: block;
    object-fit: cover;
  }
  .asset-name{
    font-size: 15px;
    font-weight: 600;
  }
  .asset-ticker{
    font-size: 12.5px;
    color: var(--text-secondary);
    margin-top: 1px;
  }
  .amount-cell{ display:none; }
  .amount-main{ font-size: 14.5px; font-weight: 600; }
  .value-cell{ text-align:right; font-size: 15px; font-weight: 700; }
  .change-cell{ text-align:right; font-size: 14px; font-weight: 700; }
  .change-up{ color: var(--green); }
  .change-down{ color: #ef4444; }
  .rank-badge{
    font-size: 11px;
    color: var(--text-tertiary);
    min-width: 22px;
  }

  /* Action buttons */
  .actions{
    display:grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    margin: 16px 16px 0;
  }
  .action-btn{
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 16px;
    padding: 14px 4px 12px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    color: var(--text-primary);
    font-size: 12.5px;
    cursor:pointer;
  }
  .action-btn .icon{
    color: var(--purple);
    font-size: 18px;
    line-height:1;
  }

  svg{ display:block; }

  /* Floating Action Button */
  .fab-wrap{
    position: fixed;
    right: 20px;
    bottom: 24px;
    z-index: 900;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 12px;
  }
  .fab-main{
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--purple);
    border: none;
    color: #fff;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(139,92,246,0.5);
    transition: transform 0.25s ease;
  }
  .fab-wrap.open .fab-main{ transform: rotate(45deg); }
  .fab-menu{
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 18px;
    padding: 8px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    opacity: 0;
    transform: translateY(10px) scale(0.96);
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    min-width: 170px;
  }
  .fab-wrap.open .fab-menu{
    opacity: 1;
    transform: translateY(0) scale(1);
    pointer-events: auto;
  }
  .fab-item{
    display:flex;
    align-items:center;
    gap: 12px;
    cursor: pointer;
    padding: 10px 10px;
    border-radius: 12px;
    transition: background 0.15s;
  }
  .fab-item:active, .fab-item:hover{
    background: rgba(255,255,255,0.06);
  }
  .fab-item-label{
    color: var(--text-primary);
    font-size: 14px;
    font-weight: 600;
  }
  .fab-item-icon{
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: #1a1a24;
    color: var(--purple);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .fab-backdrop{
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.3);
    z-index: 890;
    display:none;
  }
  .fab-backdrop.open{ display:block; }

  /* Chat modal */
  .chat-box{
    display:flex;
    flex-direction:column;
    height: 50vh;
  }
  .chat-messages{
    flex:1;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:10px;
    padding: 4px 2px 12px;
  }
  .chat-bubble{
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.4;
  }
  .chat-bubble.ai{
    background: #1a1a24;
    align-self: flex-start;
    border-bottom-left-radius: 4px;
  }
  .chat-bubble.user{
    background: var(--purple);
    color: #fff;
    align-self: flex-end;
    border-bottom-right-radius: 4px;
  }
  .chat-input-row{
    display:flex;
    gap:8px;
    margin-top: 8px;
  }
  .chat-input-row input{ flex:1; }
  .chat-send-btn{
    background: var(--purple);
    border:none;
    color:#fff;
    width: 44px;
    border-radius: 12px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /* Settings modal */
  .settings-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding: 14px 2px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .settings-row:last-child{ border-bottom:none; }
  .settings-label{ font-size: 14.5px; }
  .settings-sub{ font-size: 12.5px; color: var(--text-secondary); margin-top:2px; }
  .toggle-switch{
    width: 42px;
    height: 24px;
    border-radius: 20px;
    background: #2a2a36;
    position: relative;
    cursor: pointer;
    flex-shrink:0;
    transition: background 0.2s;
  }
  .toggle-switch.on{ background: var(--purple); }
  .toggle-switch::after{
    content:'';
    position:absolute;
    top:3px; left:3px;
    width:18px; height:18px;
    border-radius:50%;
    background:#fff;
    transition: left 0.2s;
  }
  .toggle-switch.on::after{ left: 21px; }

  /* Swipeable Portfolio / Favorite cards */
  .swipe-container{
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    gap: 0;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .swipe-container::-webkit-scrollbar{ display:none; }
  .swipe-item{
    flex: 0 0 100%;
    scroll-snap-align: start;
    padding: 0 16px;
  }
  .swipe-item .portfolio-card{ margin: 16px 0 0; }
  .swipe-dots{
    display:flex;
    justify-content:center;
    gap: 6px;
    padding: 10px 0 2px;
  }
  .swipe-dot{
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(255,255,255,0.2);
    transition: background 0.2s, width 0.2s;
  }
  .swipe-dot.active{
    background: var(--purple);
    width: 16px;
    border-radius: 4px;
  }

  /* Modal */
  .modal-overlay{
    display:none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 1000;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-overlay.open{ display:flex; }
  .modal-box{
    width: 100%;
    max-width: 480px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 24px 24px 0 0;
    padding: 20px;
    max-height: 85vh;
    overflow-y: auto;
    animation: slideUp 0.2s ease-out;
  }
  @keyframes slideUp{
    from{ transform: translateY(30px); opacity: 0; }
    to{ transform: translateY(0); opacity: 1; }
  }
  .modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom: 18px;
  }
  .modal-header h3{ font-size: 19px; font-weight: 700; }
  .modal-close{
    background: #1a1a24;
    border: none;
    color: var(--text-primary);
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor: pointer;
  }
  .form-group{ margin-bottom: 16px; }
  .form-label{
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 6px;
    display:block;
  }
  .form-input, .form-select{
    width: 100%;
    background: #111118;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 12px 14px;
    color: var(--text-primary);
    font-size: 15px;
    outline: none;
  }
  .form-input:focus, .form-select:focus{ border-color: var(--purple); }
  .form-input::placeholder{ color: var(--text-tertiary); }
  .form-select{ appearance: none; -webkit-appearance: none; cursor: pointer; }
  .form-row{ display:flex; gap:10px; }
  .form-row .form-group{ flex:1; }
  .address-box{
    background: #111118;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 14px;
    font-family: monospace;
    font-size: 13px;
    word-break: break-all;
    color: var(--text-primary);
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap: 10px;
  }
  .copy-btn{
    background: var(--purple);
    border:none;
    color:#fff;
    font-size: 12.5px;
    font-weight:600;
    padding: 7px 12px;
    border-radius: 10px;
    cursor:pointer;
    flex-shrink:0;
  }
  .qr-placeholder{
    width: 160px;
    height: 160px;
    background: #fff;
    border-radius: 12px;
    margin: 0 auto 16px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .form-note{
    font-size: 12.5px;
    color: var(--text-tertiary);
    margin-top: -8px;
    margin-bottom: 16px;
  }
  .submit-btn{
    width: 100%;
    background: var(--purple);
    border: none;
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    padding: 14px;
    border-radius: 14px;
    cursor: pointer;
    margin-top: 4px;
  }
  .fee-row{
    display:flex;
    justify-content:space-between;
    font-size: 13px;
    color: var(--text-secondary);
    padding: 10px 2px;
    border-top: 1px solid rgba(255,255,255,0.06);
    margin-top: 4px;
  }
</style>
</head>
<body>

  <div class="header">
    <div>
      <h1>My Wallet</h1>
      <div class="sub">Main Account</div>
    </div>
    <div class="bell">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
    </div>
  </div>

  <div class="balance-card">
    <div class="balance-top">
      <div class="balance-label">
        Total Balance
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
      </div>
      <div class="currency-pill-wrap">
        <select class="currency-pill" id="currency-select">
          <option value="USD">USD</option>
          <option value="IDR">IDR</option>
        </select>
      </div>
    </div>
    <div class="balance-amount" id="balance-amount">$0.00</div>
    <div class="balance-btc">≈ 0.000000 BTC</div>
    <div class="change-row">
      <div class="change-badge">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        +0.00%
      </div>
      <div class="change-today">Today</div>
    </div>
  </div>

  <div class="actions">
    <div class="action-btn" data-action="send"><span class="icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </span>Send</div>
    <div class="action-btn" data-action="receive"><span class="icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
    </span>Receive</div>
    <div class="action-btn" data-action="swap"><span class="icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
    </span>Swap</div>
    <div class="action-btn" data-action="buy"><span class="icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
    </span>Buy</div>
    <div class="action-btn" data-action="sell"><span class="icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14"/></svg>
    </span>Sell</div>
  </div>

  <div class="swipe-container" id="swipe-container">
    <div class="swipe-item">
      <div class="portfolio-card">
        <div class="portfolio-header">
          <h2>Portfolio</h2>
          <a href="#" class="view-details">View Details <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 6l6 6-6 6"/></svg></a>
        </div>
        <div class="col-headers">
          <span>Asset</span><span>Value (USD)</span><span>Change</span>
        </div>
        <div id="portfolio-list"></div>
      </div>
    </div>
    <div class="swipe-item">
      <div class="portfolio-card">
        <div class="portfolio-header">
          <h2>Favorite</h2>
        </div>
        <div class="col-headers">
          <span>Asset</span><span>Value (USD)</span><span>Change</span>
        </div>
        <div id="favorite-list"></div>
      </div>
    </div>
  </div>
  <div class="swipe-dots" id="swipe-dots">
    <div class="swipe-dot active"></div>
    <div class="swipe-dot"></div>
  </div>

  <div class="portfolio-card">
    <div class="portfolio-header">
      <h2>Market</h2>
    </div>
    <div class="search-box">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" id="coin-search" placeholder="Cari koin (nama atau simbol)...">
    </div>
    <div class="range-pills" id="range-pills"></div>
    <div class="market-col-headers">
      <span></span><span>Asset</span><span class="price-header" id="price-header">Price (USD)</span><span>24h</span>
    </div>

    <div id="asset-list"></div>
    <div class="list-status" id="list-status">Memuat 1000 koin...</div>
  </div>

  <div class="fab-wrap" id="fab-wrap">
    <div class="fab-menu" id="fab-menu">
      <div class="fab-item" data-fab="google">
        <span class="fab-item-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        </span>

}

function buildOfflineList(){
  const list = knownCoins.map(([name, sym]) => ({ name, symbol: sym }));
  const seen = new Set(list.map(c => c.symbol));
  let idx = 0;
  while (list.length < 1000){
    const a = wA[idx % wA.length];
    const b = wB[Math.floor(idx / wA.length) % wB.length];
    const c = wC[Math.floor(idx / (wA.length * wB.length)) % wC.length];
    const name = `${a}${b} ${c}`;
    let sym = (a.slice(0,2) + b.slice(0,1) + c.slice(0,2)).toUpperCase();
    let n = 0;
    while (seen.has(sym)){ n++; sym = (a.slice(0,2) + b.slice(0,1) + c.slice(0,2)).toUpperCase() + n; }
    seen.add(sym);
    list.push({ name, symbol: sym });
    idx++;
  }
  return list.slice(0, 1000);
}

function offlineIconHtml(symbol, seedBase){
  if (realLogos[symbol]) return realLogos[symbol];
  const seed = Math.abs(hashStr(symbol + seedBase));
  const template = iconTemplates[seed % iconTemplates.length];
  const palette = brandPalette[seed % brandPalette.length];
  return template(seed, palette[0], palette[1], symbol.slice(0,2));
}

function buildOfflineRow(coin, index){
  const seed = hashStr(coin.symbol + index);
  const rand = seededRand(seed);
  const rank = index + 1;
  let priceUsd;
  if (rank <= 2) priceUsd = 20000 + rand() * 80000;
  else if (rank <= 10) priceUsd = 1 + rand() * 5000;
  else if (rank <= 50) priceUsd = 0.1 + rand() * 200;
  else if (rank <= 200) priceUsd = 0.001 + rand() * 20;
  else priceUsd = 0.00001 + rand() * 2;
  const change = (rand() - 0.45) * 20;
  const usdToIdrFallback = 15800;
  return {
    rank, name: coin.name, symbol: coin.symbol,
    priceUsd, priceIdr: priceUsd * usdToIdrFallback,
    change, iconHtml: offlineIconHtml(coin.symbol, index)
  };
}

function formatPrice(value, curr){
  if (curr === 'IDR'){
    if (value >= 1) return 'Rp' + Math.round(value).toLocaleString('id-ID');
    return 'Rp' + value.toFixed(2);
  }
  if (value >= 1) return '$' + value.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
  if (value >= 0.01) return '$' + value.toFixed(4);
  return '$' + value.toFixed(8);
}

function buildRangePills(){
  const ranges = [];
  for (let i = 0; i < 1000; i += 100){ ranges.push([i, i + 100]); }
  rangePillsEl.innerHTML = ranges.map(([s, e]) =>
    `<div class="range-pill${s === rangeStart ? ' active' : ''}" data-start="${s}" data-end="${e}">${s + 1}-${e}</div>`
  ).join('');
  rangePillsEl.querySelectorAll('.range-pill').forEach(pill => {
    pill.addEventListener('click', () => {
      rangeStart = parseInt(pill.dataset.start, 10);
      rangeEnd = parseInt(pill.dataset.end, 10);
      rangePillsEl.querySelectorAll('.range-pill').forEach(p => p.classList.remove('active'));
      pill.classList.add('active');
      searchEl.value = '';
      render();
    });
  });
}

function fetchWithProxyFallback(url){
  return fetch(url).then(r => {
    if (!r.ok) throw new Error('bad response');
    return r.json();
  }).catch(() => {
    // Direct fetch blocked (commonly by CORS when opened as a local file).
    // Retry through a public CORS proxy that adds permissive CORS headers.
    const proxied = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(url);
    return fetch(proxied).then(r => {
      if (!r.ok) throw new Error('proxy bad response');
      return r.json();
    });
  });
}

async function tryLoadLiveData(){
  try {
    const pages = [1, 2, 3, 4];
    const [usdResults, idrResults, exRateRes] = await Promise.all([
      Promise.all(pages.map(p => fetchWithProxyFallback(`https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=250&page=${p}&sparkline=false`))),
      Promise.all(pages.map(p => fetchWithProxyFallback(`https://api.coingecko.com/api/v3/coins/markets?vs_currency=idr&order=market_cap_desc&per_page=250&page=${p}&sparkline=false`))),
      fetchWithProxyFallback('https://api.coingecko.com/api/v3/exchange_rates').catch(() => null)
    ]);

    const usdFlat = usdResults.flat();
    const idrFlat = idrResults.flat();
    if (!usdFlat.length) throw new Error('empty result');

    const idrById = new Map(idrFlat.map(c => [c.id, c]));

    allCoins = usdFlat.map((c, i) => {
      const idrMatch = idrById.get(c.id);
      const symUpper = (c.symbol || '').toUpperCase();
      return {
        rank: c.market_cap_rank || (i + 1),
        name: c.name,
        symbol: symUpper,
        priceUsd: c.current_price ?? 0,
        priceIdr: idrMatch ? (idrMatch.current_price ?? 0) : (c.current_price ?? 0) * 15800,
        change: c.price_change_percentage_24h ?? 0,
        iconHtml: `<img src="${c.image}" alt="${symUpper}" loading="lazy" onerror="this.parentElement.innerHTML=window.__fallbackIcon('${symUpper}', ${i})">`
      };
    }).sort((a, b) => a.rank - b.rank);

    usingLiveData = true;
    return true;
  } catch (err) {
    console.error('Live data fetch failed, using offline dataset:', err);
    return false;
  }
}

window.__fallbackIcon = (symbol, seedBase) => offlineIconHtml(symbol, seedBase);

async function init(){
  buildRangePills();
  const liveOk = await tryLoadLiveData();
  if (!liveOk){
    allCoins = buildOfflineList().map(buildOfflineRow);
  }
  render();
}

function fakeAddress(symbol){
  const seed = Math.abs(hashStr('addr-' + symbol));
  const rand = seededRand(seed);
  const chars = '0123456789abcdefghijklmnopqrstuvwxyz';
  let s = '';
  const len = symbol === 'BTC' ? 34 : 42;
  const prefix = symbol === 'BTC' ? 'bc1q' : '0x';
  for (let i = 0; i < len - prefix.length; i++){ s += chars[Math.floor(rand() * chars.length)]; }
  return prefix + s;
}

      const text = addrText.textContent;
      if (navigator.clipboard) navigator.clipboard.writeText(text).catch(() => {});
      copyBtn.textContent = 'Copied!';
      setTimeout(() => { copyBtn.textContent = 'Copy'; }, 1500);
    });
  }
  if (type === 'chat'){
    const input = document.getElementById('chat-input');
    const sendBtn = document.getElementById('chat-send');
    const messagesEl = document.getElementById('chat-messages');
    const aiReplies = [
      'Baik, saya catat. Ada lagi yang ingin ditanyakan?',
      'Untuk saat ini harga ditampilkan dalam mode simulasi/offline ya.',
      'Anda bisa cek portofolio di bagian atas untuk ringkasan aset Anda.',
      'Silakan gunakan menu Send/Receive/Swap untuk transaksi.',
      'Terima kasih, apakah ada hal lain yang bisa saya bantu?'
    ];
    function sendMessage(){
      const text = input.value.trim();
      if (!text) return;
      const userBubble = document.createElement('div');
      userBubble.className = 'chat-bubble user';
      userBubble.textContent = text;
      messagesEl.appendChild(userBubble);
      input.value = '';
      messagesEl.scrollTop = messagesEl.scrollHeight;
      setTimeout(() => {
        const aiBubble = document.createElement('div');
        aiBubble.className = 'chat-bubble ai';
        aiBubble.textContent = aiReplies[Math.floor(Math.random() * aiReplies.length)];
        messagesEl.appendChild(aiBubble);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }, 500);
    }
    sendBtn.addEventListener('click', sendMessage);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });
  }
  if (type === 'settings'){
    ['s-notif', 's-biometric', 's-dark'].forEach(id => {
      const el = document.getElementById(id);
      el.addEventListener('click', () => el.classList.toggle('on'));
    });
    const currSel = document.getElementById('s-currency');
    currSel.value = currency;
    currSel.addEventListener('change', () => {
      currencySelect.value = currSel.value;
      currencySelect.dispatchEvent(new Event('change'));
    });
  }
}

document.querySelectorAll('.action-btn').forEach(btn => {
  btn.addEventListener('click', () => openModal(btn.dataset.action));
});
modalClose.addEventListener('click', closeModal);
modalOverlay.addEventListener('click', (e) => {
  if (e.target === modalOverlay) closeModal();
});

// ---- FAB (+) button: expand menu with Google / Chat With AI / Settings ----
const fabWrap = document.getElementById('fab-wrap');
const fabMain = document.getElementById('fab-main');

fabMain.addEventListener('click', () => {
  fabWrap.classList.toggle('open');
});

function openExternal(url){
  const a = document.createElement('a');
  a.href = url;
  a.target = '_blank';
  a.rel = 'noopener noreferrer';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

document.querySelectorAll('.fab-item').forEach(item => {
  item.addEventListener('click', () => {
    const action = item.dataset.fab;
    fabWrap.classList.remove('open');
    if (action === 'google'){
      openExternal('https://www.google.com');
    } else if (action === 'chat'){
      openExternal('https://gemini.google.com');
    } else if (action === 'settings'){
      openModal('settings');
    }
  });
});

document.addEventListener('click', (e) => {
  if (fabWrap.classList.contains('open') && !fabWrap.contains(e.target)){
    fabWrap.classList.remove('open');
  }
});
</script>
